[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tuneassist"
dynamic = ["version"]
description = "AI-assisted, recommendation-only engine tuning analyzer (GM/HPTuners + Holley)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "tuneassist" }]
# Lean by design: the engine is pandas/numpy; the GUI is stdlib + a browser.
# (textual/rich left with the retired TUI -- see legacy/README.md.)
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
# Pulled only when building distributable single-file binaries.
build = ["pyinstaller>=6.0"]
# Image heatmaps (optional).
plot = ["matplotlib>=3.7"]

[project.scripts]
# `pipx install .` / `uv tool install .` exposes this command.
tuneassist = "tuneassist.cli:main"

[tool.setuptools]
packages = ["tuneassist", "tuneassist.gui"]

[tool.setuptools.package-data]
# the GUI's web assets ship inside the package (offline, no build step)
"tuneassist.gui" = ["static/**/*"]

[tool.setuptools.dynamic]
version = { attr = "tuneassist.__version__" }
