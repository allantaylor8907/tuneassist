[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tuneassist"
dynamic = ["version"]
description = "AI-assisted, recommendation-only engine tuning analyzer (GM/HPTuners + Holley)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "tuneassist" }]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "rich>=13.0",
    "textual>=0.80",
]

[project.optional-dependencies]
# Pulled only when building distributable single-file binaries.
build = ["pyinstaller>=6.0"]
# Image heatmaps (optional).
plot = ["matplotlib>=3.7"]
# Host the Textual demo in a browser (zero-install try-it link).
serve = ["textual-serve>=1.0"]

[project.scripts]
# `pipx install .` / `uv tool install .` exposes these commands.
tuneassist = "tuneassist.cli:main"
tuneassist-tui = "tuneassist.tui:run_tui"
tuneassist-demo = "tuneassist.demo:run_demo"

[tool.setuptools]
packages = ["tuneassist", "tuneassist.gui"]

[tool.setuptools.package-data]
# the GUI's web assets ship inside the package (offline, no build step)
"tuneassist.gui" = ["static/**/*"]

[tool.setuptools.dynamic]
version = { attr = "tuneassist.__version__" }
