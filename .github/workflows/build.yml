name: build

# Runs tests on every push/PR, and builds single-file binaries for
# Windows (the primary target -- HP Tuners and Holley EFI only run there) and
# Linux. On a version tag (v*) the binaries are attached to a GitHub Release so
# non-technical users can just download one file and run it. (macOS builds were
# dropped in v0.1.22: the vendor tuning software doesn't run on macOS.)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Run test suite
        run: |
          for t in tests/test_*.py; do python "$t"; done

  binaries:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            binname: tuneassist.exe
            # OS-specific release asset name -- must stay distinct (no collisions)
            # and must contain the OS keyword the self-updater matches on
            # (update.py: 'linux' / 'windows').
            asset: tuneassist-windows-x64.exe
            # PyInstaller --add-data uses ';' on Windows, ':' elsewhere
            datasep: ";"
            # The Windows desktop experience: a real app icon, a branded splash
            # while the onefile bundle extracts, and hide-console at the
            # BOOTLOADER (no black console flash on double-click; a terminal
            # launch still gets full CLI output).
            extraargs: >-
              --icon packaging/icon.ico
              --splash packaging/splash.png
              --hide-console hide-early
          - os: ubuntu-latest
            binname: tuneassist
            asset: tuneassist-linux-x64
            datasep: ":"
            extraargs: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[build]"
      - name: Build single-file binary
        run: pyinstaller --onefile --name tuneassist --noconfirm --paths . ${{ matrix.extraargs }} --add-data "tuneassist/gui/static${{ matrix.datasep }}tuneassist/gui/static" packaging/entry.py
      - name: Smoke-test the binary (headless JSON)
        shell: bash
        run: ./dist/${{ matrix.binname }} tests/fixtures/ride42.csv --json > out.json && python -c "import json;d=json.load(open('out.json'));assert d['stage']=='TUNE_VE_SD',d['stage'];print('binary OK')"
      - name: Verify --version works
        shell: bash
        run: ./dist/${{ matrix.binname }} --version
      - name: Rename to the OS-specific asset name
        shell: bash
        run: mv "dist/${{ matrix.binname }}" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    needs: binaries
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # The default GITHUB_TOKEN is read-only; publishing a Release needs write.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Generate SHA-256 checksums
        run: |
          cd artifacts
          sha256sum */* | sed 's# .*/#  #' > ../SHA256SUMS.txt
          cd ..
          cat SHA256SUMS.txt
      - name: Attach binaries + checksums to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*
            SHA256SUMS.txt
