name: build

# Runs tests on every push/PR, and builds single-file binaries for
# Windows / macOS / Linux. On a version tag (v*) the binaries are attached to a
# GitHub Release so non-technical users can just download one file and run it.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Run test suite
        run: |
          for t in tests/test_*.py; do python "$t"; done

  binaries:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binname: tuneassist
            # OS-specific release asset name -- must stay distinct (no collisions)
            # and must contain the OS keyword the self-updater matches on
            # (update.py: 'linux' / 'macos' / 'windows').
            asset: tuneassist-linux-x64
          - os: windows-latest
            binname: tuneassist.exe
            asset: tuneassist-windows-x64.exe
          - os: macos-latest
            binname: tuneassist
            asset: tuneassist-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[build]"
      - name: Build single-file binary
        run: pyinstaller --onefile --name tuneassist --noconfirm --paths . --collect-all textual packaging/entry.py
      - name: Smoke-test the binary (headless JSON)
        shell: bash
        run: ./dist/${{ matrix.binname }} tests/fixtures/ride42.csv --json > out.json && python -c "import json;d=json.load(open('out.json'));assert d['stage']=='TUNE_VE_SD',d['stage'];print('binary OK')"
      - name: Verify --version works
        shell: bash
        run: ./dist/${{ matrix.binname }} --version
      - name: Rename to the OS-specific asset name
        shell: bash
        run: mv "dist/${{ matrix.binname }}" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    needs: binaries
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # The default GITHUB_TOKEN is read-only; publishing a Release needs write.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Generate SHA-256 checksums
        run: |
          cd artifacts
          sha256sum */* | sed 's# .*/#  #' > ../SHA256SUMS.txt
          cd ..
          cat SHA256SUMS.txt
      - name: Attach binaries + checksums to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*
            SHA256SUMS.txt
